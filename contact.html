
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | ShoreSynk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-slate-900 text-white py-12 text-center">
    <h1 class="text-4xl font-bold">Get in Touch</h1>
    <p class="text-lg mt-2">We’d love to hear about your integration or DevOps needs.</p>
  </header>

  <section class="max-w-3xl mx-auto px-6 py-12">
    <form action="https://formspree.io/f/xkndndyp" method="POST" class="space-y-6 bg-white p-8 rounded shadow">
      <div>
        <label for="name" class="block text-sm font-semibold">Your Name</label>
        <input type="text" name="name" id="name" required class="w-full mt-1 p-2 border rounded" />
      </div>
      <div>
        <label for="email" class="block text-sm font-semibold">Your Email</label>
        <input type="email" name="email" id="email" required class="w-full mt-1 p-2 border rounded" />
      </div>
      <div>
        <label for="message" class="block text-sm font-semibold">Your Message</label>
        <textarea name="message" id="message" rows="5" required class="w-full mt-1 p-2 border rounded"></textarea>
      </div>
      <button type="submit" class="bg-teal-600 text-white font-semibold px-6 py-3 rounded hover:bg-teal-500 transition">
        Send Message
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-500">
      Or email us directly at <a href="mailto:info@shoresynk.com" class="text-blue-600 hover:underline">info@shoresynk.com</a>
    </p>
  </section>

  <footer class="bg-slate-800 text-white text-center py-6 mt-12">
    <p class="text-sm">© 2025 ShoreSynk Technologies</p>
  </footer>

</body>
</html>
